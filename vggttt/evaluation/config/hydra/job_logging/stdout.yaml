# @package _group_
version: 1
formatters:
  simple:
    format: '[%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
root:
  level: DEBUG
  handlers: [console]

disable_existing_loggers: false

